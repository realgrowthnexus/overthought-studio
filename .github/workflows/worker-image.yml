name: worker-image
on:
  push:
    branches: [main]
    paths: ["worker/**", "assets/style/fonts/**", ".github/workflows/worker-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Unit tests
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r worker/requirements.txt pytest
          cd worker && python -m pytest -q tests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          push: true
          tags: |
            ghcr.io/realgrowthnexus/overthought-studio-worker:latest
            ghcr.io/realgrowthnexus/overthought-studio-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
