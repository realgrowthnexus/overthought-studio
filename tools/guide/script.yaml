# Roman Urdu video guide for Overthought Studio. One Urdu sentence per Roman subtitle line (same count, same order).
# The voice reads `urdu`; the screen shows `roman`. Actions run in order, spread over the scene's narration.
# actions: goto <target> | click <target> | hover <target> | scroll <px> | wait <ms> | type <target> <text> |
#          redbar on|off | play <target>.  Targets are Playwright selectors.
chapters:
  - id: 1
    title_roman: "Studio kya hai"
    scenes:
      - id: "1.1"
        route: /
        highlight: "main h1"
        actions:
          - {do: wait, ms: 600}
        roman:
          - "Assalam-o-alaikum. Yeh Overthought Studio hai."
          - "Yeh studio khud TikTok ke liye videos banata hai."
          - "Topic dhoondna, script likhna, awaaz aur tasveerein, sab khud karta hai."
          - "Aap ka kaam sirf do cheezein hain: dekhna, aur video approve karna."
          - "Paise, keys aur settings aap ke bete sambhalenge."
          - "Is guide mein hum har zaroori safha dekhenge."
          - "Aaiye, qadam ba qadam shuru karte hain."
        urdu:
          - "السلام علیکم، یہ اوور تھاٹ اسٹوڈیو ہے۔"
          - "یہ اسٹوڈیو خود ٹک ٹاک کے لیے ویڈیوز بناتا ہے۔"
          - "موضوع ڈھونڈنا، اسکرپٹ لکھنا، آواز اور تصویریں، سب خود کرتا ہے۔"
          - "آپ کا کام صرف دو چیزیں ہیں، دیکھنا، اور ویڈیو منظور کرنا۔"
          - "پیسے، کیز اور سیٹنگز آپ کے بیٹے سنبھالیں گے۔"
          - "اس گائیڈ میں ہم ہر ضروری صفحہ دیکھیں گے۔"
          - "آئیے، قدم بہ قدم شروع کرتے ہیں۔"

  - id: 2
    title_roman: "Login"
    scenes:
      - id: "2.1"
        route: /login
        fresh: true
        highlight: "form"
        actions:
          - {do: type, target: "input[type=email]", text: "owner@demo.local"}
          - {do: type, target: "input[type=password]", text: "DemoPass!2026x"}
          - {do: hover, target: "button[type=submit]"}
          - {do: click, target: "button[type=submit]"}
        roman:
          - "Studio kholne ke liye browser mein yeh pata likhein:"
          - "studio.getgrowthnexus.com"
          - "Phir apni email aur password daalein."
          - "Aur peela 'Sign in' ka button dabayein."
        urdu:
          - "اسٹوڈیو کھولنے کے لیے براؤزر میں یہ پتہ لکھیں۔"
          - "اسٹوڈیو ڈاٹ گیٹ گروتھ نیکسس ڈاٹ کام۔"
          - "پھر اپنی ای میل اور پاس ورڈ ڈالیں۔"
          - "اور پیلا سائن اِن کا بٹن دبائیں۔"
      - id: "2.2"
        route: /
        highlight: null
        actions:
          - {do: wait, ms: 400}
        roman:
          - "Password bhool jayein to fikr na karein."
          - "Bete se kahein, woh naya password bana denge."
        urdu:
          - "اگر پاس ورڈ بھول جائیں تو فکر نہ کریں۔"
          - "بیٹے سے کہیں، وہ نیا پاس ورڈ بنا دیں گے۔"

  - id: 3
    title_roman: "Overview: pehla safha"
    scenes:
      - id: "3.1"
        route: /
        highlight: "main section:first-of-type, main .grid:first-of-type"
        actions:
          - {do: wait, ms: 400}
          - {do: hover, target: "main >> text=Waiting for review"}
        roman:
          - "Login ke baad yeh pehla safha khulta hai: Overview."
          - "Upar chaar dabbe hain: views, followers, review aur kharcha."
          - "'Waiting for review' mein woh videos hain jo aap ka intezar kar rahi hain."
          - "Kharche wala dabba bete ke liye hai, us ki fikr na karein."
        urdu:
          - "لاگ اِن کے بعد یہ پہلا صفحہ کھلتا ہے، اوورویو۔"
          - "اوپر چار ڈبے ہیں، ویوز، فالوورز، ریویو اور خرچہ۔"
          - "ویٹنگ فار ریویو میں وہ ویڈیوز ہیں جو آپ کا انتظار کر رہی ہیں۔"
          - "خرچے والا ڈبہ بیٹے کے لیے ہے، اس کی فکر نہ کریں۔"
      - id: "3.2"
        route: /
        highlight: "main >> text=Production line >> xpath=ancestor::*[contains(@class,'rounded')][1]"
        actions:
          - {do: scroll, px: 260}
        roman:
          - "Neeche 'Production line' hai."
          - "Har video baayen se daayen chalti hai, jaise kaarkhane mein."
          - "Research, script, fact-check, tasveer, awaaz, aur aakhir mein 'Ready'."
          - "Aap ko yahan kuch nahi karna, bas dekhna hai."
        urdu:
          - "نیچے پروڈکشن لائن ہے۔"
          - "ہر ویڈیو بائیں سے دائیں چلتی ہے، جیسے کارخانے میں۔"
          - "ریسرچ، اسکرپٹ، فیکٹ چیک، تصویر، آواز، اور آخر میں ریڈی۔"
          - "آپ کو یہاں کچھ نہیں کرنا، بس دیکھنا ہے۔"
      - id: "3.3"
        route: /
        redbar: true
        highlight: "[role=alert]"
        actions:
          - {do: wait, ms: 500}
        roman:
          - "Kabhi kabhi upar ek laal patti nazar aayegi."
          - "Is ka matlab hai ke koi kaam ruk gaya hai."
          - "Patti mein likha hota hai ke kya ruka aur kyun."
          - "Jaise yahan: awaaz wali service ka credit khatam ho gaya."
          - "Aisi patti dekhein to bas bete ko bata dein."
          - "Woh credit daalenge, aur kaam khud dobara shuru ho jayega."
        urdu:
          - "کبھی کبھی اوپر ایک لال پٹی نظر آئے گی۔"
          - "اس کا مطلب ہے کہ کوئی کام رک گیا ہے۔"
          - "پٹی میں لکھا ہوتا ہے کہ کیا رکا اور کیوں۔"
          - "جیسے یہاں، آواز والی سروس کا کریڈٹ ختم ہو گیا ہے۔"
          - "ایسی پٹی دیکھیں تو بس بیٹے کو بتا دیں۔"
          - "وہ کریڈٹ ڈالیں گے، اور کام خود دوبارہ شروع ہو جائے گا۔"

  - id: 4
    title_roman: "Channels"
    scenes:
      - id: "4.1"
        route: /
        highlight: "main [role=switch] >> nth=0"
        actions:
          - {do: click, target: "aside >> role=link[name='Channels']"}
          - {do: hover, target: "main [role=switch] >> nth=0"}
        roman:
          - "Ab baayen menu mein 'Channels' dabayein."
          - "Yahan paanch channel hain, har ek ka apna TikTok account."
          - "Har channel ke saath ek button hai: on ya off."
          - "Peela matlab chal raha hai, grey matlab ruka hua."
          - "Yeh button bete se pooch kar hi badlein."
        urdu:
          - "اب بائیں مینو میں چینلز دبائیں۔"
          - "یہاں پانچ چینل ہیں، ہر ایک کا اپنا ٹک ٹاک اکاؤنٹ۔"
          - "ہر چینل کے ساتھ ایک بٹن ہے، آن یا آف۔"
          - "پیلا مطلب چل رہا ہے، گرے مطلب رکا ہوا۔"
          - "یہ بٹن بیٹے سے پوچھ کر ہی بدلیں۔"
      - id: "4.2"
        route: /channels
        highlight: "main >> role=button[name='Make a video now']"
        actions:
          - {do: click, target: "main >> role=link[name=/^Overthought/] >> nth=0"}
          - {do: hover, target: "main >> role=button[name='Make a video now']"}
        roman:
          - "Kisi channel par click karein to us ka safha khulta hai."
          - "'Make a video now' se foran ek nayi video banna shuru hoti hai."
          - "Lekin is ki zaroorat nahi, studio roz khud videos banata hai."
        urdu:
          - "کسی چینل پر کلک کریں تو اس کا صفحہ کھلتا ہے۔"
          - "میک اے ویڈیو ناؤ سے فوراً ایک نئی ویڈیو بننا شروع ہوتی ہے۔"
          - "لیکن اس کی ضرورت نہیں، اسٹوڈیو روز خود ویڈیوز بناتا ہے۔"
      - id: "4.3"
        route: /channels/overthought
        highlight: "main ol"
        actions:
          - {do: click, target: "main >> role=link[name='Idea bank']"}
          - {do: scroll, px: 200}
        roman:
          - "'Idea bank' mein agli videos ke topic hain."
          - "Sab se upar wala topic sab se pehle banega."
          - "Yeh list studio khud bharta rehta hai."
        urdu:
          - "آئیڈیا بینک میں اگلی ویڈیوز کے موضوع ہیں۔"
          - "سب سے اوپر والا موضوع سب سے پہلے بنے گا۔"
          - "یہ فہرست اسٹوڈیو خود بھرتا رہتا ہے۔"

  - id: 5
