        route: "/videos/@ready"
        highlight: "main video"
        actions:
          - {do: play, target: "main video"}
          - {do: wait, ms: 1500}
          - {do: hover, target: "main >> role=button[name='Approve']"}
        roman:
          - "Jab video tayyar ho jati hai, to yahan aa jati hai: 'Ready for review'."
          - "Aap video chala kar dekhte hain. Pasand aaye to peela 'Approve' ka button."
          - "Pasand na aaye to 'Reject', aur ek note. Woh note agli script ko behtar banata hai."
        urdu:
          - "جب ویڈیو تیار ہو جاتی ہے، تو یہاں آ جاتی ہے، ریڈی فار ریویو۔"
          - "آپ ویڈیو چلا کر دیکھتے ہیں، پسند آئے تو پیلا اپروو کا بٹن۔"
          - "پسند نہ آئے تو ریجیکٹ، اور ایک نوٹ، وہ نوٹ اگلی اسکرپٹ کو بہتر بناتا ہے۔"
