          - "بس، اکاؤنٹ یہاں آ جاتا ہے، اور کنیکٹڈ لکھا ہوتا ہے۔"
          - "ہم کبھی ٹک ٹاک کا پاس ورڈ نہیں دیکھتے، یہ ٹک ٹاک کا آفیشل طریقہ ہے۔"
