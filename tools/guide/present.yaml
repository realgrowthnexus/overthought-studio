        route: "/videos/@ready"
        highlight: 'section:has(h2:text-is("Title and post time"))'
        actions:
          - {do: hover, target: "#video-title"}
          - {do: hover, target: "#post-time"}
          - {do: hover, target: "main >> text=Approve and schedule"}
        roman:
          - "Yahan video ka naam aur post ka waqt badal sakte hain."
          - "Waqt chun kar 'Approve and schedule' dabayein: approve bhi, aur usi waqt post bhi."
          - "Waqt na chunein to studio khud agla khali waqt de deta hai."
        urdu:
          - "یہاں ویڈیو کا نام اور پوسٹ کا وقت بدل سکتے ہیں۔"
          - "وقت چن کر اپروو اینڈ شیڈول دبائیں، ویڈیو منظور بھی، اور اسی وقت پوسٹ بھی۔"
          - "وقت نہ چنیں تو اسٹوڈیو خود اگلا خالی وقت دے دیتا ہے۔"
      - id: "5.3"
        route: "/videos/@ready"
        highlight: 'section:has(h2:text-is("Cover"))'
        actions:
          - {do: scroll, px: 450}
          - {do: hover, target: "#cover-ms"}
          - {do: click, target: "#cover-ms"}
          - {do: hover, target: "main >> text=Copy caption"}
        roman:
          - "Cover ke liye video ka koi bhi frame chun sakte hain."
          - "Caption aur hashtags bhi yahin hain, aur 'Copy caption' ka button."
        urdu:
          - "کور کے لیے ویڈیو کا کوئی بھی فریم چن سکتے ہیں۔"
          - "کیپشن اور ہیش ٹیگز بھی یہیں ہیں، اور کاپی کیپشن کا بٹن۔"

