          - {do: wait, ms: 1200}
          - {do: hover, target: "main >> text=@overthought.studio"}
        roman:
          - "Uske baad 'Connect account' ka button aa jata hai."
          - "Isse dabane par TikTok ka apna login safha khulta hai."
          - "Wahan TikTok account se login karte hain, aur 'Allow' dabate hain."
          - "Bas. Account yahan aa jata hai, aur 'Connected' likha hota hai."
          - "Hum kabhi TikTok ka password nahi dekhte. Yeh TikTok ka official tareeqa hai."
        urdu:
          - "اس کے بعد کنیکٹ اکاؤنٹ کا بٹن آ جاتا ہے۔"
          - "اسے دبانے پر ٹک ٹاک کا اپنا لاگ اِن صفحہ کھلتا ہے۔"
