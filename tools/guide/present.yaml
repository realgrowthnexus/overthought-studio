          - "ایپ سے دو کیز ملتی ہیں، جو سیٹنگز میں ڈال دی جاتی ہیں۔"
          - "پھر ٹک ٹاک اس ایپ کا جائزہ لیتا ہے، یہ صرف ایک دفعہ کا کام ہے۔"
