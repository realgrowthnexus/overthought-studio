# Presentation video: a full overview of Overthought Studio for the owner to show their sir (2026-11-26).
# Same format as script.yaml: the voice reads `urdu`, the screen shows `roman` (same count, same order).
# Extra scene keys: prep / after = tools/demo/seed_demo.py commands run before / after recording the scene.
#   GUIDE_SCRIPT=present.yaml GUIDE_NAME=overthought-overview python tools/guide/tts.py build   (etc.)
chapters:
  - id: 1
    title_roman: "Overthought Studio kya hai"
    scenes:
      - id: "1.1"
        route: /
        highlight: "main h1"
        actions:
          - {do: wait, ms: 800}
          - {do: hover, target: "main >> text=Production line"}
        roman:
          - "Assalam-o-alaikum. Yeh Overthought Studio hai."
          - "Yeh ek khudkaar studio hai jo TikTok ke liye videos banata hai."
          - "Maqsad: paanch American TikTok channels, Creator Rewards program ke liye."
          - "Har video ek minute se lambi hoti hai, kyunke Creator Rewards ki yehi shart hai."
          - "Topic, research, script, tasveerein, awaaz aur editing, sab studio khud karta hai."
          - "Insaan ka kaam sirf do hai: video approve karna, aur TikTok par Post dabana."
        urdu:
          - "السلام علیکم، یہ اوور تھاٹ اسٹوڈیو ہے۔"
          - "یہ ایک خودکار اسٹوڈیو ہے جو ٹک ٹاک کے لیے ویڈیوز بناتا ہے۔"
          - "مقصد، پانچ امریکی ٹک ٹاک چینلز، کریئیٹر ریوارڈز پروگرام کے لیے۔"
          - "ہر ویڈیو ایک منٹ سے لمبی ہوتی ہے، کیونکہ کریئیٹر ریوارڈز کی یہی شرط ہے۔"
          - "موضوع، تحقیق، اسکرپٹ، تصویریں، آواز اور ایڈیٹنگ، سب اسٹوڈیو خود کرتا ہے۔"
          - "انسان کا کام صرف دو ہیں، ویڈیو منظور کرنا، اور ٹک ٹاک پر پوسٹ دبانا۔"
      - id: "1.2"
        route: /
        highlight: null
        actions:
          - {do: wait, ms: 600}
        roman:
          - "Yeh sab ek apne VPS server par chalta hai, jo hum pehle se kiraye par lete hain."
          - "Script aur research ke liye Claude AI use hota hai, hamare Claude plan par."
          - "Tasveerein RunPod par banti hain, aur awaaz bilkul muft hai."
          - "Ek video ka kharcha taqreeban saat cent hai."
        urdu:
          - "یہ سب ہمارے اپنے وی پی ایس سرور پر چلتا ہے، جو ہم پہلے سے کرائے پر لیتے ہیں۔"
          - "اسکرپٹ اور تحقیق کے لیے کلاڈ اے آئی استعمال ہوتا ہے، ہمارے کلاڈ پلان پر۔"
          - "تصویریں رن پوڈ پر بنتی ہیں، اور آواز بالکل مفت ہے۔"
          - "ایک ویڈیو کا خرچہ تقریباً سات سینٹ ہے۔"

  - id: 2
    title_roman: "Dashboard: Overview"
    scenes:
      - id: "2.1"
        route: /
        highlight: "main section:first-of-type"
        actions:
          - {do: hover, target: "main >> text=Views, last 7 days"}
          - {do: hover, target: "main >> text=Waiting for review"}
          - {do: hover, target: "main >> text=Spend this month"}
          - {do: hover, target: "main >> text=Studio running"}
        roman:
          - "Login karte hi yeh pehla safha khulta hai: Overview."
          - "Upar chaar dabbe: hafte ke views, followers, review, aur mahine ka kharcha."
          - "Daayein taraf ek switch hai. Isse poora studio ek click mein rok sakte hain."
        urdu:
          - "لاگ اِن کرتے ہی یہ پہلا صفحہ کھلتا ہے، اوورویو۔"
          - "اوپر چار ڈبے، پچھلے ہفتے کے ویوز، فالوورز، ریویو، اور اس مہینے کا خرچہ۔"
          - "دائیں طرف ایک سوئچ ہے، اس سے پورا اسٹوڈیو ایک کلک میں روک سکتے ہیں۔"
      - id: "2.2"
        route: /
        highlight: 'section:has(h2:text-is("Production line"))'
        actions:
          - {do: scroll, px: 250}
          - {do: hover, target: "main >> text=Voice"}
          - {do: hover, target: "main >> text=Ready"}
        roman:
          - "Yeh production line hai. Har video baayein se daayein chalti hai."
          - "Queued, research, script, check, tasveerein, awaaz, render, aur aakhir mein Ready."
          - "Yeh sab live hai. Worker jaise hi ek qadam poora karta hai, card aage barh jata hai."
        urdu:
          - "یہ پروڈکشن لائن ہے، ہر ویڈیو بائیں سے دائیں چلتی ہے۔"
          - "قطار، تحقیق، اسکرپٹ، چیک، تصویریں، آواز، رینڈر، اور آخر میں ریڈی۔"
          - "یہ سب لائیو ہے، ورکر جیسے ہی ایک قدم پورا کرتا ہے، کارڈ آگے بڑھ جاتا ہے۔"
      - id: "2.3"
        route: /
        highlight: 'section:has(h2:text-is("Up next"))'
        actions:
          - {do: scroll, px: 650}
          - {do: hover, target: "main >> text=Recent activity"}
          - {do: scroll, px: 600}
        roman:
          - "Neeche 'Up next' hai: kaunsi video kab post hogi."
          - "Saath mein 'Recent activity', yaani studio ne abhi kya kiya."
          - "Aur sab se neeche har service ki sehat: Claude, RunPod, TikTok aur storage."
        urdu:
          - "نیچے اپ نیکسٹ ہے، کونسی ویڈیو کب پوسٹ ہوگی۔"
          - "ساتھ میں ریسنٹ ایکٹیویٹی، یعنی اسٹوڈیو نے ابھی کیا کیا۔"
          - "اور سب سے نیچے ہر سروس کی صحت، کلاڈ، رن پوڈ، ٹک ٹاک اور اسٹوریج۔"

  - id: 3
    title_roman: "Ek video kaise banti hai"
    scenes:
      - id: "3.1"
        route: /
        highlight: 'section:has(h2:text-is("Production line"))'
        actions:
          - {do: scroll, px: 250}
          - {do: wait, ms: 600}
        roman:
          - "Ab dekhte hain ek video kaise banti hai."
          - "Pehle Claude internet par asli research dhoondta hai, asli studies."
          - "Phir script: pehle second mein hook, beech mein kahani, aakhir mein sabaq."
          - "Phir ek halka check: content achha ho, TikTok ke qawaneen ke mutabiq ho."
          - "Phir chhe scenes ki tasveerein ek saath banti hain, aur awaaz record hoti hai."
          - "Aakhir mein video edit hoti hai: likhai, animation aur music ke saath."
          - "Yeh poora kaam taqreeban paanch minute mein ho jata hai."
        urdu:
          - "اب دیکھتے ہیں ایک ویڈیو کیسے بنتی ہے۔"
          - "پہلے کلاڈ انٹرنیٹ پر اصلی تحقیق ڈھونڈتا ہے، اصلی اسٹڈیز۔"
          - "پھر وہ ایک اسکرپٹ لکھتا ہے، پہلے سیکنڈ میں ہُک، بیچ میں کہانی، آخر میں سبق۔"
          - "پھر ایک ہلکا چیک، مواد اچھا ہو، ٹک ٹاک کے قوانین کے مطابق ہو۔"
          - "پھر چھ مناظر کی تصویریں ایک ساتھ بنتی ہیں، اور آواز ریکارڈ ہوتی ہے۔"
          - "آخر میں ویڈیو ایڈٹ ہوتی ہے، لکھائی، اینیمیشن اور میوزک کے ساتھ۔"
          - "یہ پورا کام تقریباً پانچ منٹ میں ہو جاتا ہے۔"
      - id: "3.2"
        route: "/videos/@ready"
        highlight: 'section:has(h2:text-is("Script"))'
        actions:
          - {do: scroll, px: 700}
          - {do: wait, ms: 800}
          - {do: scroll, px: 900}
          - {do: hover, target: "main >> text=Sources"}
        roman:
          - "Har video ke safhe par uska poora script dikhta hai, line ba line."
          - "Neeche woh sources hain jin se maloomat li gayi, asli research ke links ke saath."
          - "Aur har video ka kharcha bhi, sent tak."
        urdu:
          - "ہر ویڈیو کے صفحے پر اس کا پورا اسکرپٹ دکھتا ہے، لائن بہ لائن۔"
          - "نیچے وہ سورسز ہیں جن سے معلومات لی گئی، اصلی تحقیق کے لنکس کے ساتھ۔"
          - "اور ہر ویڈیو کا خرچہ بھی، سینٹ تک۔"

  - id: 4
    title_roman: "Channels"
    scenes:
      - id: "4.1"
        route: /channels
        highlight: "main ul li:first-child"
        actions:
          - {do: wait, ms: 600}
          - {do: hover, target: "main >> text=Running"}
          - {do: hover, target: "main ul li:first-child >> text=Edit"}
        roman:
          - "Yeh Channels ka safha hai. Har card ek TikTok account hai."
          - "Card par topic, posting ka tareeqa, din ki videos, aur pichle hafte ke views."
          - "On aur off ka switch, aur 'Edit' ka button jis se channel ki settings badalti hain."
          - "Abhi ek channel chal raha hai. Baqi chaar tayyar hain, jab chahein chalu karein."
        urdu:
          - "یہ چینلز کا صفحہ ہے، ہر کارڈ ایک ٹک ٹاک اکاؤنٹ ہے۔"
          - "کارڈ پر موضوع، پوسٹنگ کا طریقہ، دن میں کتنی ویڈیوز، اور پچھلے ہفتے کے ویوز۔"
          - "آن اور آف کا سوئچ، اور ایڈٹ کا بٹن جس سے چینل کی سیٹنگز بدلتی ہیں۔"
          - "ابھی ایک چینل چل رہا ہے، باقی چار تیار ہیں، جب چاہیں چالو کر سکتے ہیں۔"
      - id: "4.2"
        route: /channels/overthought
        highlight: "main >> text=Make a video now"
        actions:
          - {do: hover, target: "main >> text=Make a video now"}
          - {do: wait, ms: 600}
          - {do: click, target: "main a[href$='/ideas']"}
          - {do: scroll, px: 300}
        roman:
          - "Channel ke andar 'Make a video now' ka button hai, foran nayi video ke liye."
          - "Har channel ke paas ideas ka bank hai. Studio khud naye ideas dhoondta rehta hai."
          - "Har Monday weekly review dekhta hai kya chala, aur agla hafta behtar karta hai."
        urdu:
          - "چینل کے اندر میک اے ویڈیو ناؤ کا بٹن ہے، فوراً نئی ویڈیو کے لیے۔"
          - "ہر چینل کے پاس آئیڈیاز کا بینک ہے، اسٹوڈیو خود نئے آئیڈیاز ڈھونڈتا رہتا ہے۔"
          - "ہر پیر ہفتہ وار جائزہ دیکھتا ہے کیا چلا، اور اگلا ہفتہ بہتر کرتا ہے۔"

  - id: 5
    title_roman: "Video approve aur schedule"
    scenes:
